<script>
(() => {
"use strict";

/* ====================== constants & helpers ====================== */
const LEAD_MS = 4000;
const CFG = window.SCHULTE_CONFIG || {};
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));
const params = new URLSearchParams(location.search);
const LS = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let offset = 0;
const now = () => Date.now() + offset;
const AVATARS = ["🦁","🐯","🦊","🐼","🐸","🦄","🐙","🦉","🐢","🦅","🐘","🦋","🔥","⚡","👑","🚀"];

function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function shuf(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const tileColor = i => `hsl(${((i * 14.4) % 360).toFixed(1)} 82% 47%)`;
const newSeed = () => Math.floor(Math.random() * 2147483647);
const randomCode = () => Array.from({ length: 4 }, () => "ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random() * 23)]).join("");

/* ====================== theme, bokeh, sound ====================== */
function applyTheme(t) { document.documentElement.dataset.theme = t; $("#tthm").textContent = t === "dark" ? "🌙" : "☀️"; LS.set("bg-theme", t); }
$("#tthm").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
applyTheme(LS.get("bg-theme") || "dark");

(function bokeh(){
  const cols = ["139,63,168","43,74,154","31,111,122","184,135,42","90,60,170"], box = $("#bokeh");
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span"), size = 140 + Math.random()*320, c = cols[i % cols.length];
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100-8}%;top:${Math.random()*100-8}%;background:repeating-radial-gradient(circle,rgba(${c},.20) 0 18px,rgba(${c},.08) 18px 34px);--x:${(Math.random()-.5)*120}px;--y:${(Math.random()-.5)*120}px;--d:${14+Math.random()*16}s;filter:blur(1.5px);opacity:.55`;
    box.appendChild(s);
  }
})();

const Snd = (() => {
  let ac = null, muted = LS.get("bg-muted") === "1", drum = null;
  const btn = $("#tsnd"); const paint = () => { btn.textContent = muted ? "🔇" : "🔊"; };
  btn.onclick = () => { muted = !muted; LS.set("bg-muted", muted ? "1" : "0"); paint(); unlock(); }; paint();
  function unlock() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch {} }
  function tone(f, d, type = "sine", vol = .15, when = 0, slide = 0) {
    if (muted || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch {}
  }
  return {
    unlock,
    pop(s) { tone(500 + Math.min(s, 14) * 45, .1, "triangle", .2); },
    soft() { tone(440, .06, "triangle", .1); },
    bad() { tone(160, .25, "sawtooth", .13, 0, -80); },
    beep() { tone(660, .12, "square", .09); },
    go() { tone(990, .3, "square", .1); },
    tick() { tone(1200, .05, "square", .07); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, "triangle", .16, i * .11)); },
    done() { tone(392, .15, "triangle", .14); tone(523, .25, "triangle", .14, .13); },
    drumStart() { this.drumStop(); drum = setInterval(() => tone(95 + Math.random() * 15, .07, "triangle", .2), 70); },
    drumStop() { if (drum) { clearInterval(drum); drum = null; } },
    reveal() { tone(330, .2, "triangle", .16); tone(494, .3, "triangle", .16, .12); }
  };
})();
document.addEventListener("pointerdown", () => Snd.unlock(), { once: true });
const haptic = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

/* ====================== effects ====================== */
function burst(el) {
  if (!el || !el.getBoundingClientRect) return;
  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  for (let i = 0; i < 9; i++) {
    const s = document.createElement("i"); s.className = "spark";
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${i % 2 ? "#ffd23f" : "#fff"}`;
    document.body.appendChild(s);
    const a = Math.PI * 2 * i / 9 + Math.random() * .5, d = 30 + Math.random() * 34;
    s.animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`, opacity: 0 }], { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => s.remove();
  }
}
function confetti() {
  const c = document.createElement("canvas"); c.style.cssText = "position:fixed;inset:0;z-index:9;pointer-events:none";

function watch(code, onData) {
  let busy = false, again = false, dead = false;
  async function pull() {
    if (dead) return; if (busy) { again = true; return; } busy = true;
    try { const [room, players] = await Promise.all([DB.getRoom(code), DB.listPlayers(code)]); if (!dead) onData(room, players); } catch (e) { console.error(e); }
    busy = false; if (again) { again = false; setTimeout(pull, 120); }
  }
  const off = DB.onChange(code, pull), iv = setInterval(pull, 2500); pull();
  return () => { dead = true; off(); clearInterval(iv); };
}

const gameOf = r => GAMES[(r && r.game) || "schulte"] || GAMES.schulte;

/* ====================== ranking & leaderboard ====================== */
function rank(players, G, dur) {
  return players.map(p => ({ ...p, adj: (p.finished_ms != null ? p.finished_ms : dur * 1000) + (p.mistakes || 0) * G.penalty }))
    .sort((a, b) => (b.found - a.found) || (a.adj - b.adj) || a.name.localeCompare(b.name));
}
function statText(p, G) { return `${G.stat(p)}${p.mistakes ? ` · ${p.mistakes} miss${p.mistakes > 1 ? "es" : ""}` : ""}${p.finished_ms != null && G.time ? " · " + G.time(p.finished_ms) : ""}`; }

function renderLB(box, players, G, dur, limit) {
  const r = rank(players, G, dur), top = r.slice(0, limit), max = Math.max(G.barMax || 0, ...r.map(p => p.found), 1);
  if (!box.__rows) box.__rows = new Map();
  const before = new Map(); box.__rows.forEach((el, id) => before.set(id, el.getBoundingClientRect().top));
  const keep = new Set(top.map(p => p.id));
  box.__rows.forEach((el, id) => { if (!keep.has(id)) { el.remove(); box.__rows.delete(id); } });
  const oldMore = box.querySelector(".more"); if (oldMore) oldMore.remove();
  top.forEach((p, i) => {
    let el = box.__rows.get(p.id);
    if (!el) { el = document.createElement("div"); el.innerHTML = `<span class="pos"></span><span class="av"></span><span class="nm"></span><div class="bar"><i></i></div><span class="st"></span>`; box.__rows.set(p.id, el); }
    el.className = "row" + (i === 0 && p.found > 0 ? " first" : "") + (i < 3 ? " m" + (i + 1) : "");
    el.children[0].textContent = i + 1; el.children[1].textContent = p.avatar || "🧠"; el.children[2].textContent = p.name;
    el.children[3].firstChild.style.width = (p.found / max * 100) + "%"; el.children[4].textContent = statText(p, G);
    box.appendChild(el);
  });
  if (r.length > limit) { const m = document.createElement("div"); m.className = "more"; m.textContent = `+${r.length - limit} more`; box.appendChild(m); }
  box.__rows.forEach((el, id) => { if (before.has(id)) { const dy = before.get(id) - el.getBoundingClientRect().top; if (Math.abs(dy) > 2) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 380, easing: "ease" }); } });
}

async function doJoin(avatar) {
  const err = m => { $("#err").textContent = m; $("#join").disabled = false; };

  if (code.length !== 4 || !name) return err("Enter the 4-letter room code and your name.");
  $("#join").disabled = true; $("#err").textContent = "";
  try {
    const room = await DB.getRoom(code);
    if (!room) return err("Room not found. Check the code.");
    const players = await DB.listPlayers(code), prev = saved.get(code);
    const id = prev && prev.name.toLowerCase() === name.toLowerCase() ? prev.id : null;
    if (players.find(p => p.name.toLowerCase() === name.toLowerCase() && p.id !== id)) return err("That name is taken in this room. Add an initial.");
    const pid = id || uuid();
    if (!id) await DB.upsertPlayer({ id: pid, room_code: code, name, avatar, found: 0, mistakes: 0, finished_ms: null, ready: false });
    else await DB.updatePlayer(pid, { avatar });

let P = null;
function startPlayer(code, id, name, avatar) {
  P = { code, id, name, avatar, room: null, players: [], g: null, pushT: null, lastCd: null, lastSec: null, ctx: null };
  P.unwatch = watch(code, (room, players) => { P.room = room; P.players = players; playerTick(); });
  P.iv = setInterval(playerTick, 100);
  view("p-load", `<div class="card"><h2>Joining…</h2></div>`);
}

function playerTick() {
  if (!P || !P.room) return;
  const r = P.room, t = r.start_at ? now() - r.start_at : null;
  if (!P.g || P.g.seed !== r.seed) {
    P.g = { seed: r.seed, score: 0, mistakes: 0, finishedMs: null, done: false, late: false, streak: 0 };
    if (r.status === "playing" && t !== null && t > 1000) {
      const me = P.players.find(p => p.id === P.id);
      if (me && (me.found > 0 || me.mistakes > 0 || me.finished_ms != null)) { P.g.score = me.found; P.g.mistakes = me.mistakes; if (me.finished_ms != null) { P.g.done = true; P.g.finishedMs = me.finished_ms; } }
      else P.g.late = true;
    }
  }
  const g = P.g, dur = r.duration || 25;
  if (r.status === "lobby" || t === null) return showWaiting();
  if (t < 0) return showCountdown(Math.ceil(-t / 1000));
  if (g.late) return showLate();
  if (g.done || t >= dur * 1000) return showResult();
  showPlay(t);
}

function showWaiting() {

    });
  setHTML("#gs", `<div class="small">NEXT GAME</div><div style="font-size:2rem">${G.icon}</div><b>${esc(G.name)}</b><div class="sub">${esc(G.blurb)}</div>${r.game === "word" ? `<div class="gold" style="font-weight:900;margin-top:4px">${esc(catLabel(r.category))}</div>` : ""}`);
  const b = $("#rd"); if (b) { b.textContent = rdy ? "Ready ✓ (tap to undo)" : "I'm ready"; b.classList.toggle("ghost", rdy); }
  setText("#wc", P.players.length); setText("#wr", P.players.filter(p => p.ready).length);
}
function showLate() { view("p-late", `<div class="card"><h2>Round in progress</h2><p class="sub">You'll be in for the next one. Stay on this page.</p></div>`); }
function showCountdown(n) {
  const G = gameOf(P.room);
  view("p-cd", `<div class="card"><div style="font-size:2.6rem">${G.icon}</div><p class="label">${esc(G.name)}</p><div class="big" id="cd"></div><p class="sub">Get ready</p></div>`);
  setText("#cd", n); if (P.lastCd !== n) { P.lastCd = n; Snd.beep(); }
}

function makeCtx(G, dur) {
  const g = P.g, r = P.room;
  const streakUI = () => { const s = $("#st"); if (!s) return; if (g.streak >= 3) { s.textContent = `🔥 x${g.streak}`; s.classList.add("on"); s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); } else s.classList.remove("on"); };
  const c = {
    seed: r.seed, cat: r.category, dur, s: g,
    t: () => now() - r.start_at,
    active: () => !g.done && now() - r.start_at >= 0 && now() - r.start_at < dur * 1000,
    hit(el) { g.streak++; g.score++; Snd.pop(g.streak); haptic(10); burst(el); streakUI(); push(false); },
    miss(el) { g.mistakes++; g.streak = 0; Snd.bad(); haptic(70); if (el && el.classList) { el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); } streakUI(); push(false); },
    breakStreak() { g.streak = 0; streakUI(); },
    finish(ms) { g.done = true; g.finishedMs = Math.round(ms != null ? ms : now() - r.start_at); Snd.done(); push(true); playerTick(); }
  };
  return c;
}

function showPlay(t) {

  view("p-play:" + r.seed, `
    <div class="card" style="max-width:460px">

    </div>`, () => { Snd.go(); P.lastSec = null; P.ctx = makeCtx(G, dur); G.mount($("#stage"), P.ctx); });

}

  setHTML("#res", `<div class="avbig">${esc(P.avatar)}</div>${head}

async function shareCard(o) {

}
function hostFinished() {
  const r = H.room, G = gameOf(r), dur = r.duration || 25, rk = rank(H.players, G, dur), has = rk[0] && rk[0].found > 0;
  view("h-done:" + r.seed, `<div class="hostplay"><div class="label winner-label">${G.icon} ${esc(G.name)} results</div>
    <div class="drum" id="dr"></div><div class="podium" id="pod"></div><div class="panel" id="lb"></div>
    <div class="btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="back">Back to games</button></div></div>`, () => {
      $("#again").onclick = () => { $("#again").disabled = true; startRoundFrom(); };
      $("#back").onclick = backToLobby;
      const top = rk.slice(0, 3), pod = $("#pod");
      if (!has) { $("#dr").textContent = "No scores this round"; return; }
      const heights = [190, 140, 100], medal = ["linear-gradient(#ffe27a,#f2a900)", "linear-gradient(#eef1f8,#aeb8cf)", "linear-gradient(#f3b583,#c97a3a)"];
      const order = [1, 0, 2].filter(i => top[i]);
      pod.innerHTML = order.map(i => { const p = top[i]; return `<div class="pcol" data-i="${i}"><div class="crown">${i === 0 ? "👑" : ""}</div><div class="pav"></div><div class="pnm"></div><div class="pst"></div><div class="pbase" style="height:${heights[i]}px;background:${medal[i]}">${i + 1}</div></div>`; }).join("");
      order.forEach(i => { const col = pod.querySelector(`[data-i="${i}"]`), p = top[i]; col.querySelector(".pav").textContent = p.avatar || "🧠"; col.querySelector(".pnm").textContent = p.name; col.querySelector(".pst").textContent = statText(p, G); });
      const dr = $("#dr"); let dots = 0; dr.textContent = "Drumroll"; const di = setInterval(() => { dr.textContent = "Drumroll" + ".".repeat(++dots % 4); }, 300); Snd.drumStart();
      const show = (i, delay, last) => setTimeout(() => { const col = pod.querySelector(`[data-i="${i}"]`); if (!col) return; col.classList.add("show"); if (last) { clearInterval(di); Snd.drumStop(); dr.textContent = "Winner: " + top[0].name; Snd.win(); confetti(); } else Snd.reveal(); }, delay);
      let d = 1800; if (top[2]) { show(2, d); d += 900; } if (top[1]) { show(1, d); d += 900; } show(0, d + 400, true);
    });
  renderLB($("#lb"), H.players, G, dur, 10);
}
async function startRoundFrom() {
  const r = H.room, id = r.game || "schulte", G = GAMES[id], dd = +params.get("dur") || 0;
  try {
    await DB.resetPlayers(H.code, false);
    await DB.updateRoom(H.code, { status: "playing", start_at: now() + LEAD_MS, duration: dd || G.dur, seed: newSeed() });
  } catch (e) { console.error(e); }
}

/* ====================== boot ====================== */
(async function boot() {
  if (wantSB && !useSB) {
    view("err", `<div class="card"><h2>Game library did not load</h2><p class="sub">This browser could not load the files the game needs. Refresh the page, or try Chrome, Edge or Safari.</p><a class="btn" href="?demo=1${params.has("host") ? "&host=1" : ""}">Try demo mode</a></div>`);
    return;
  }
  if (!useSB) { const d = document.createElement("div"); d.className = "demo"; d.textContent = "Demo mode: works across tabs of one browser only. Open the page in several tabs to test."; document.body.appendChild(d); }
  try { await DB.init(); } catch (e) {
    console.error(e);
    const msg = (e && (e.message || e.details || e.hint)) || "Network request failed";
    view("err", `<div class="card"><h2>Cannot reach the game server</h2><p class="sub" id="em"></p>
      <p class="small">Some preview panes block outside connections. Open the published link in your browser instead.</p>
      <a class="btn" href="?demo=1${params.has("host") ? "&host=1" : ""}">Try demo mode</a></div>`);
    setText("#em", msg); return;
  }
  if (params.has("host")) startHost(); else showLanding();
})();
})();
</script>
